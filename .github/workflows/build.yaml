name: go-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  get-go-version:
    name: Get Go Version
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.ENGINEERING_GITHUB_PERSONAL_ACCESS_TOKEN }}

      - name: Get Go Version from go.mod
        id: get-version
        run: |
          # Extract the Go version from go.mod
          GO_VERSION=$(grep -oP '^go \K[0-9]+\.[0-9]+' go.mod)
          echo "Go Version: $GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Go Version
        run: |
          echo "Current version in go.mod is: ${{ steps.get-version.outputs.version }}"

  tests:
    name: go-tests
    needs: [ get-go-version]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go_version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Test
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.9.0
          args: --timeout=10m --modules-download-mode=readonly

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: [ tests ]
    steps:
      - name: Set up Golang
        uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2.2.0
        with:
          go-version: "1.18"
        id: go
      - name: Check out code into the Go module directory
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          fetch-depth: 0
      - name: release
        uses: cycjimmy/semantic-release-action@5982a02995853159735cb838992248c4f0f16166 # v2.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 18
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.2
            @semantic-release/changelog@6.0.1
